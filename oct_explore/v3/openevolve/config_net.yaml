# OpenEvolve config: LLMs are Cursor models via the local adapter (cursor_adapter.py on 127.0.0.1:8765).
max_iterations: 10
checkpoint_interval: 10
log_level: INFO
random_seed: 42
diff_based_evolution: true
max_code_length: 20000
llm:
  api_base: "http://127.0.0.1:8765/v1"
  api_key: "local-adapter-no-key"     # real Cursor key stays in env CURSOR_API_KEY, read by cursor-agent only
  models:
    - name: "composer-2.5"
      weight: 0.7
    - name: "gpt-5.3-codex"
      weight: 0.3
  temperature: 0.7
  max_tokens: 16000
  timeout: 900
  retries: 1
prompt:
  system_message: |
    You are improving a JAX NETWORK (features, architecture, loss, training schedule) that maps a 4-SAT formula to the
    control parameters of a FIXED native bosonic-cavity circuit (NOT QAOA; QAOA L4 is only the baseline: n=15 23.1/62.5, n=20 84.5/227).
    Fixed circuit (you cannot change it): 3 cavities x 5 bits at n=15 (2x5 at n=10), Gray-coded, chain buses only; flat prep;
    per layer l=1..4: SNAP + neighbour-bus phases = least-squares projection (product measure pv) of nm*sum_j (gamma_l + w_jl)[clause j violated]
    onto one-cavity / neighbour-pair functions; then per-cavity one-bit-flip mixer beta_l; readout p = P(satisfying assignment).
    The network outputs per formula: gamma (L,), beta (L,), w (m,L), pv (n,) via predict(n, V, SG, m).
    train(api, budget_s) must train within budget_s seconds (2 CPU cores) using api.data / api.batch / api.p_from (differentiable p over R=4 placements)
    and return predict. Fitness = FAIR round-robin: median and 90th percentile of 1/mean_r p_r on 100 held-out n=15 formulas
    (higher combined_score = -(ln med + ln B90)/2 is better). Generalisation to n=20 is checked periodically.
    HARD RULES: only numpy/jax/math/functools/itertools/collections/time imports; no file/os/sys access, no dunder access, never touch api internals;
    do NOT solve formulas classically (no SAT search, brute force, enumeration); pv must not encode a found solution (pv_acc>0.85 is penalised).
    Keep train()/predict() signatures and output shapes. Ideas: better message passing, per-layer clause weights, tail-aware loss,
    curriculum n=10->15, learning-rate schedules, initialisation of gamma/beta near the given G0/B0, regularisation for transfer to n=20.
  num_top_programs: 3
  num_diverse_programs: 2
database:
  population_size: 60
  archive_size: 20
  num_islands: 2
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
evaluator:
  timeout: 900
  max_retries: 1
  cascade_evaluation: false
  parallel_evaluations: 1
  use_llm_feedback: false
