# net16r EXPLORE phase (driver alternates with config_net16r_exploit.yaml). LLM "net16r" = cursor_adapter.py net16r mode (Grok 4.6 Fast code, Opus 5.5 medium idea every 5th call).
max_iterations: 60
checkpoint_interval: 10
log_level: INFO
random_seed: 1616
diff_based_evolution: true
max_code_length: 20000
llm:
  api_base: http://127.0.0.1:8765/v1
  api_key: local-adapter-no-key
  models:
  - name: net16r
    weight: 1.0
  temperature: 0.7
  max_tokens: 16000
  timeout: 1200
  retries: 1
prompt:
  system_message: '# Framing (Zach, 2026-10-21 15:00 CST): do NOT imitate QAOA''s global cost

    Standard QAOA assumes the full cost phase incl. long-range high-weight Z strings (e.g. arbitrary ZZZZ), which are hard in hardware; much literature approximates/reproduces them. Our cavity chain has
    three advantages:

    1. Neighbouring cavities instead of neighbouring qubits: each cavity holds several bits, so one nearest-neighbour cavity-cavity interaction couples many more bit strings at once.

    2. Much richer cost phase: on a cavity or neighbouring cavity pair we can apply an ARBITRARY phase to each Fock level (SNAP dS tables, neighbour-bus dB tables), not just Pauli-Z products. E.g. 00 and
    11 in one cavity can get different phases; Z1Z2 cannot distinguish them.

    3. Only the final answer matters: classical optimisation, so the circuit need not reproduce the ZZZZ cost evolution. Any path that concentrates probability on the ground-state bit string is fine. Relative
    phases still drive interference mid-circuit, but at readout only the bit string counts.

    Goal: search the larger hardware-native control space for a route QAOA''s Z-term picture cannot express, that still reaches the ground state. Imitating the global cost is NOT the goal.


    YOU EDIT a JAX NETWORK that maps a 4-SAT formula to control values of a FIXED native bosonic-cavity chain circuit (4 layers; per layer one SNAP

    per cavity + one bus phase per neighbour cavity pair, then per-cavity one-bit-flip mixer beta_l; readout p = P(ground state / satisfying string)).

    Cavities hold 4 bits (n=8: 2 cavities, n=12: 3, n=16: 4). The circuit''s phase tables are: compiled projection of nm*sum_j (gamma_l + w_jl)[clause j

    violated] (product measure pv) PLUS your additive tables dS (F,R,L,C,32) per cavity and dB (F,R,L,C-1,32,32) per neighbour pair (index = integer of

    the cavity''s bits, MSB first, bit j <-> variable place["cav"][f,r,c,j]; -1 unused; only 0..15 matter). The tables can give ARBITRARY phases per Fock level.

    GOAL: the native route: local phase programs (per-cavity / per-pair tables designed for amplification), NOT reproducing the global cost.

    The program has NATIVE PHASE PROGRAM families (FAMILIES / ROLE, zero-initialised gates gS/gB): optimistic clause-local tables, conditional pair

    messages (chain sweeps), rank level shaping, cavity-local Grover (capped candidate set), plus a hardness add-on. Each program has a

    ''# FAMILY: <name>'' line (pair / optimistic / rank / role / grover): KEEP it and develop THAT island''s path family.

    Fitness = FAIR round-robin over R=4 placements on held-out n=16 selection formulas: combined_score = -(ln median + ln B90)/2 of 1/p (higher better).

    Stage 1 = train(api, 60) then 30 unseen n=12 formulas, s1 = -(ln med + 2 ln B90)/3; clearly worse candidates are cut (score ~ -12) before stage 2

    (train(api, 180), n=16). So train() must already work at 60 s. Default loss: 0.5 mean + 0.5 median + CVaR-10% of log(1/p).

    train(api, budget_s) uses api.data / api.batch / api.place / api.p_from (differentiable p (F,R)). Teacher api.p_from(..., glob=True) exists but

    imitating the global cost is NOT the goal (LAM_GLOB stays 0 unless clearly justified).

    DIAGNOSTICS of the parent (chain p vs global-cost p at n=8/12, 5 worst n=12 formulas + dropped-cost fraction, a CHECKABLE TARGET) are shown: use them.

    HARD RULES: size-free (transfer zero-shot from n=8/12 to n=16); only numpy/jax/math/functools/itertools/collections/time imports; no file/os/sys,

    no dunder, never touch api internals; NO classical solving: no full-assignment enumeration (no 1<<n / 2**n tables), no argmin over assignments,

    never build more than one 256-entry pair table per pair at once (guard rejects); pv must not encode a solution (pv_acc>0.85 => -20).

    jnp (not np) on traced arrays; clip grads, modest lr (NaN => -20); keep memory modest (child RSS cap ~3 GB).

    '
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true
  max_artifact_bytes: 4096
database:
  population_size: 100
  archive_size: 25
  num_islands: 5
  elite_selection_ratio: 0.15
  exploitation_ratio: 0.3
  exploration_ratio: 0.5
  migration_interval: 12
  migration_rate: 0.1
evaluator:
  timeout: 2400
  max_retries: 0
  cascade_evaluation: false
  parallel_evaluations: 2
  use_llm_feedback: false
